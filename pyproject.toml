[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datadoctor-ai"
version = "1.0.0"
description = "Privacy-first CSV/XLSX quality profiler, cleaner, API and dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["data-quality", "pandas", "fastapi", "csv", "excel"]
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
datadoctor = "datadoctor.cli:main"

[tool.setuptools.package-data]
datadoctor = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
